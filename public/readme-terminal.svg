<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ryan Erick — Full-stack and mobile developer</title>
  <desc id="desc">An animated dark terminal interface with a cyan and green technology grid.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#0B1727"/>
      <stop offset="1" stop-color="#07131A"/>
    </linearGradient>
    <linearGradient id="edge" x1="70" y1="28" x2="1130" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" stroke="#38BDF8" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="52" y="68" width="1096" height="250"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .scan { animation: scan 5.5s linear infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .role-1 { animation: role1 9s ease-in-out infinite; }
    .role-2 { animation: role2 9s ease-in-out infinite; }
    .role-3 { animation: role3 9s ease-in-out infinite; }
    .node-a { animation: nodeA 7s ease-in-out infinite; }
    .node-b { animation: nodeB 6s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(-420px); } to { transform: translateX(1500px); } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes role1 { 0%, 27% { opacity: 1; transform: translateY(0); } 31%, 96% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; } }
    @keyframes role2 { 0%, 30% { opacity: 0; transform: translateY(8px); } 34%, 60% { opacity: 1; transform: translateY(0); } 64%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes role3 { 0%, 63% { opacity: 0; transform: translateY(8px); } 67%, 93% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes nodeA { 0%, 100% { transform: translate(0, 0); opacity: .35; } 50% { transform: translate(22px, -12px); opacity: .9; } }
    @keyframes nodeB { 0%, 100% { transform: translate(0, 0); opacity: .8; } 50% { transform: translate(-18px, 14px); opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .pulse, .cursor, .role-1, .role-2, .role-3, .node-a, .node-b { animation: none; }
      .role-2, .role-3 { display: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#shell)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="324" rx="15" fill="url(#grid)"/>
  <path d="M1 58H1199" stroke="#1E3A4C"/>
  <circle cx="28" cy="30" r="6" fill="#FB7185"/>
  <circle cx="50" cy="30" r="6" fill="#FBBF24"/>
  <circle cx="72" cy="30" r="6" fill="#4ADE80"/>
  <text x="600" y="35" text-anchor="middle" class="mono" font-size="13" letter-spacing="2" fill="#64748B">RYAN.DEV / PROFILE</text>

  <g clip-path="url(#screen)">
    <rect class="scan" x="-420" y="58" width="420" height="270" fill="url(#scan)"/>
  </g>

  <g opacity="0.55">
    <path d="M950 98H1060L1090 128" stroke="#22D3EE"/>
    <path d="M1020 264H1092L1120 236" stroke="#4ADE80"/>
    <circle class="node-a" cx="1090" cy="128" r="4" fill="#22D3EE" filter="url(#glow)"/>
    <circle class="node-b" cx="1020" cy="264" r="4" fill="#4ADE80" filter="url(#glow)"/>
  </g>

  <text x="70" y="100" class="mono" font-size="17" fill="#4ADE80">ryan@cameroon</text>
  <text x="218" y="100" class="mono" font-size="17" fill="#64748B">:</text>
  <text x="230" y="100" class="mono" font-size="17" fill="#38BDF8">~/workspace</text>
  <text x="344" y="100" class="mono" font-size="17" fill="#E2E8F0">$ whoami</text>

  <text x="68" y="164" class="mono" font-size="43" font-weight="700" letter-spacing="1" fill="#F8FAFC">RYAN ERICK</text>
  <rect x="68" y="178" width="420" height="3" rx="1.5" fill="url(#edge)"/>

  <g class="mono" font-size="21" fill="#93C5FD">
    <text class="role-1" x="70" y="221">Full-Stack Engineer</text>
    <text class="role-2" x="70" y="221">Mobile App Developer</text>
    <text class="role-3" x="70" y="221">Tech Educator &amp; Mentor</text>
  </g>
  <rect class="cursor" x="344" y="202" width="11" height="24" rx="1" fill="#22D3EE" filter="url(#glow)"/>

  <text x="70" y="267" class="mono" font-size="16" fill="#94A3B8">Building useful digital systems from Cameroon to the world.</text>
  <g transform="translate(70 294)">
    <circle class="pulse" cx="6" cy="6" r="6" fill="#4ADE80" filter="url(#glow)"/>
    <text x="22" y="11" class="mono" font-size="14" letter-spacing="1.2" fill="#86EFAC">AVAILABLE FOR COLLABORATION</text>
  </g>

  <g transform="translate(935 157)" class="mono">
    <rect width="180" height="70" rx="10" fill="#07111D" stroke="#1E4B5F"/>
    <text x="18" y="27" font-size="12" fill="#64748B">SYSTEM STATUS</text>
    <circle class="pulse" cx="21" cy="48" r="4" fill="#4ADE80"/>
    <text x="34" y="53" font-size="14" fill="#CBD5E1">shipping ideas</text>
  </g>
</svg>
