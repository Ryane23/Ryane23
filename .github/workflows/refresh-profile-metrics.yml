name: Refresh profile metrics

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate live GitHub telemetry
        run: node .github/scripts/generate-profile-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Ryane23

      - name: Commit changed metrics
        run: |
          if git diff --quiet -- public/github-live-metrics.svg public/github-live-data.json; then
            echo "Metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github-live-metrics.svg public/github-live-data.json
          git commit -m "chore: refresh profile metrics"
          git push
